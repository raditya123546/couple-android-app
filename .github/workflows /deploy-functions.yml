name: Deploy Functions

on:
  push:
    branches: [main]
    paths:
      - 'firebase-deploy.zip'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip firebase project
        run: |
          unzip -o firebase-deploy.zip
          ls -R | head -100

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/service-account.json" >> $GITHUB_ENV

      - name: Install functions deps
        run: |
          cd functions
          npm install

      - name: Deploy functions
        run: firebase deploy --only functions --project coupleapp-c73e3 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
          
