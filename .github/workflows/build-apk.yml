

name: Build APK (ZIP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o couple-android-app.zip
          ls -R | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy keystore
        run: cp couple-android-app/keystore.jks couple-android-app/app/keystore.jks

      - name: Build Release
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: couple12345
          KEY_ALIAS: couplekangen
          KEY_PASSWORD: couple12345
        run: |
          cd couple-android-app
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: couple-kangen-apk
          path: couple-android-app/app/build/outputs/apk/release/app-release.apk
